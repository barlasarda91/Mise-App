<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Mise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=10">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="box-hd"><span class="lbl">Mise · Daily Ops</span><span class="ix">LOGIN</span></div>
    <div class="box-bd">
      <div class="brandline"><span class="glyph"></span><span class="word">BOXX</span></div>
      <form method="post" action="/login">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
        <button type="submit">Enter</button>
      </form>
      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    </div>
  </div>
</div>
</body>
</html>
