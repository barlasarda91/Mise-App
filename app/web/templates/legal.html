<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Mise · Boxx Coffee Roasters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=9">
<style>
  .legal{max-width:760px;margin:0 auto;padding:40px 20px 80px}
  .legal h1{font-family:var(--font-display);font-weight:700;font-size:28px;margin:18px 0 6px}
  .legal .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:26px}
  .legal h2{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;margin:26px 0 8px}
  .legal p,.legal li{font-size:14.5px;line-height:1.65;margin-bottom:10px}
  .legal ul{margin:0 0 10px 20px}
</style>
</head>
<body>
<div class="legal">
  <div class="mark" style="color:var(--ink)"><span class="glyph" style="border-color:var(--ink)"></span><span class="word">BOXX</span></div>
  <h1>{{ title }}</h1>
  <div class="sub">Mise — internal operations application · Boxx Coffee Roasters, Los Angeles · Effective {{ effective }}</div>
  {{ body | safe }}
</div>
</body>
</html>
