<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{% block title %}Mise{% endblock %} — Boxx</title>
<meta name="theme-color" content="#17150F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mise">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=19">
<script src="/static/app.js?v=7" defer></script>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><span class="glyph"></span><span class="word">BOXX</span></div>
      <div class="sub">MISE · DAILY OPS</div>
    </div>
    <nav>
      {% for item in nav %}
      <a class="navbtn{% if active_view == item.view %} active{% endif %}" href="{{ item.path }}"><span class="ix">{{ item.ix }}</span>{{ item.label }}{% if badges and badges.get(item.view) %}<span class="badge">{{ badges[item.view] }}</span>{% endif %}</a>
      {% endfor %}
    </nav>
    <div class="foot">
      <span class="addr">ARTS DISTRICT · LA<br><b>hello@boxxcoffee.com</b></span>
      <form method="post" action="/logout"><button class="linkish" type="submit">Log out</button></form>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      <div class="clock">{{ clock }}</div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
